name: foundation

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 11.0.9
          runtime: node@24
          cache: true
          # The action's own install passes --no-runtime, which pnpm 11.0.9 rejects.
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm audit --prod --audit-level=high
      - name: Test with an isolated PostgreSQL database
        shell: bash
        run: |
          set -euo pipefail
          lab_secret="$(openssl rand -hex 24)"
          echo "::add-mask::$lab_secret"
          printf 'POSTGRES_PASSWORD=%s\n' "$lab_secret" > .env
          trap 'docker compose down -v >/dev/null 2>&1 || true' EXIT
          docker compose up -d --wait db
          docker compose exec -T db createdb -U aegislab aegislab_test
          TEST_DATABASE_URL="postgresql://aegislab:${lab_secret}@127.0.0.1:5433/aegislab_test" pnpm test
      - run: pnpm build
      - run: pnpm --filter @aegislab/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  compose:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 11.0.9
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Build and start the local stack
        shell: bash
        run: |
          set -euo pipefail
          lab_secret="$(openssl rand -hex 24)"
          echo "::add-mask::$lab_secret"
          printf 'POSTGRES_PASSWORD=%s\n' "$lab_secret" > .env
          docker compose --profile probe build
          docker compose up -d --wait db api web demo-target
      - run: pnpm --filter @aegislab/web exec playwright install --with-deps chromium
      - run: pnpm test:api-live
      - run: pnpm test:live
      - name: Verify the bounded local probe
        shell: bash
        run: |
          set -euo pipefail
          docker compose --profile probe run --rm -e AEGISLAB_AUTHORIZATION_ACK=I_OWN_THIS_LOCAL_TARGET worker
          set +e
          docker compose --profile probe run --rm worker
          status=$?
          set -e
          test "$status" -eq 1
      - name: Verify probe network isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker network inspect aegislab_probe_net --format '{{.Internal}}')" = true
          set +e
          docker compose --profile probe run --rm --no-deps worker node -e "fetch('http://api:3001/api/health', {signal: AbortSignal.timeout(2000)}).then(() => process.exit(0), () => process.exit(3))"
          status=$?
          set -e
          test "$status" -eq 3
      - name: Show service status on failure
        if: failure()
        run: docker compose ps
      - name: Remove the temporary database and containers
        if: always()
        run: docker compose down -v --remove-orphans
